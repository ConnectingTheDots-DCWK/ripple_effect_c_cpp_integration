# What every push and pull request is held to: the formatting, then — once
# engine.json pins a release — the pin's signature, and the whole suite on
# Linux (GCC and Clang, both variants, shared and static, ASan), macOS and
# Windows, plus an Android cross-build, an iOS device cross-build with the
# suite run on an iOS simulator, and Emscripten under node. The repository is
# public, so these are GitHub's own runners.
#
# While no release is pinned (every digest null), there is no engine CI can
# fetch — the engine's source is private — so everything past the formatting
# is skipped with a notice. Locally, RIPPLE_ENGINE_TREE builds one.

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The versions are mise.toml's, so CI checks with what the hooks run.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: python aqua:astral-sh/uv pipx:clang-format pipx:cmakelang
      - name: clang-format
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: cmake-format
        run: |
          git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' | xargs cmake-format --check

  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pinned: ${{ steps.pin.outputs.pinned }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Is a release pinned?
        run: |
          if jq -e '.keyId != null and ([.archives[] | .. | objects | select(has("sha256")) | .sha256] | all(. != null))' engine.json > /dev/null; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::engine.json pins no release yet; the build and the tests are skipped."
          fi
      - name: The pin is a signed release
        if: steps.pin.outputs.pinned == 'true'
        run: bash scripts/pin-engine.sh --verify

  build:
    needs: pin
    if: needs.pin.outputs.pinned == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: linux-gcc }
          - { os: ubuntu-latest, preset: linux-clang, tidy: true }
          - { os: ubuntu-latest, preset: linux-asan }
          - { os: ubuntu-latest, preset: linux-static }
          - { os: ubuntu-latest, preset: linux-no-python }
          - { os: macos-latest, preset: macos-clang }
          - { os: windows-latest, preset: windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # After the developer prompt, whose PATH carries Visual Studio's own
      # CMake and Ninja: mise's are put in front of them.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: aqua:Kitware/CMake aqua:ninja-build/ninja
      - uses: actions/cache@v4
        with:
          path: out/build/${{ matrix.preset }}/_ripple_engine/downloads
          key: engine-${{ matrix.preset }}-${{ hashFiles('engine.json') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.tidy
        run: |
          git ls-files 'tests/*.cpp' 'tests/*.c' 'examples/*.cpp' 'examples/*.c' \
            | xargs clang-tidy -p out/build/${{ matrix.preset }} --quiet

  # The engine for a page built with Emscripten, played under node by every
  # Emscripten the engine's own release links it with: the oldest it
  # supports, the one Unity 6000.5 bundles, and the newest it was built with
  # (docs/consuming.md, *On the web*).
  emscripten:
    needs: pin
    if: needs.pin.outputs.pinned == 'true'
    strategy:
      fail-fast: false
      matrix:
        emsdk: ["4.0.10", "4.0.19", "6.0.12"]
        preset: [emscripten, emscripten-no-python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/build/${{ matrix.preset }}/_ripple_engine/downloads
          key: engine-${{ matrix.preset }}-${{ hashFiles('engine.json') }}
      # CMake and Ninja at mise.toml's versions rather than the image's.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: aqua:Kitware/CMake aqua:ninja-build/ninja
      - name: emsdk ${{ matrix.emsdk }}
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.emsdk }}" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ matrix.emsdk }}" > /dev/null
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ matrix.emsdk }}" > /dev/null
      - name: Configure, build and test under node
        run: |
          EMSDK_QUIET=1 source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

  android:
    needs: pin
    if: needs.pin.outputs.pinned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # CMake and Ninja at mise.toml's versions rather than the image's.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: aqua:Kitware/CMake aqua:ninja-build/ninja
      # Cross-compiled and linked against the engine's Android library; no
      # emulator, because the engine's own release ran its suites on one.
      # ANDROID_NDK_LATEST_HOME is the runner image's environment, which the
      # workflow's `env` context cannot see: read it in the shell.
      - name: Configure and build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-arm64
          cmake --build --preset android-arm64

  # The device leg only links against the engine's iOS library — nothing in CI
  # runs on a device. The simulator leg boots a simulator and runs the whole
  # suite on it through `simctl spawn booted`, the preset's crosscompiling
  # emulator; the tests read their fixtures by host path, which a spawned
  # simulator process shares. The engine's own release ran its Rust suites on a
  # simulator too — this is the binding's CMake path, link and run both.
  ios:
    needs: pin
    if: needs.pin.outputs.pinned == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: [ios-arm64, ios-simulator]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/build/${{ matrix.preset }}/_ripple_engine/downloads
          key: engine-${{ matrix.preset }}-${{ hashFiles('engine.json') }}
      # CMake and Ninja at mise.toml's versions rather than the image's.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: aqua:Kitware/CMake aqua:ninja-build/ninja
      # `simctl spawn booted` needs a booted device; the available iPhone
      # models change with the runner's Xcode, so boot the first one by UDID.
      - name: Boot a simulator
        if: matrix.preset == 'ios-simulator'
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Booting $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Warm Core Simulator's spawn path so test discovery's first spawn
          # does not pay the cold start inside its timeout.
          xcrun simctl spawn booted /usr/bin/true || true
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test on the simulator
        if: matrix.preset == 'ios-simulator'
        run: ctest --preset ${{ matrix.preset }}
