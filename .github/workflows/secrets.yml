# Secret scanning — the CI half of .pre-commit-config.yaml.
#
# The pre-commit hook scans what is staged, on machines that have it. This
# scans what actually arrived: every commit a push or a pull request brings
# (the whole branch, when a push creates one), and the default branch end to
# end weekly and on dispatch, because a credential that could not be verified
# last week may be verifiable now. It fails on any finding, unverified ones
# included, as the hook does.
#
# The action is pinned by commit, unlike the workflows' `@v4`s, because this
# is the one step whose job is to read every line in the repository; the
# image is pinned to the same release so the two cannot drift apart.

name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The scanner's version is mise.toml's, the one the commit hook runs;
      # the action itself stays pinned by digest.
      - name: Read the pinned TruffleHog version
        id: pin
        run: echo "version=$(bash scripts/mise_pin.sh aqua:trufflesecurity/trufflehog)" >> "$GITHUB_OUTPUT"
      - uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          version: ${{ steps.pin.outputs.version }}
          extra_args: --results=verified,unknown,unverified
